{{- $home := site.Home.RelPermalink -}}
{{- $hasPosts := gt (len (where site.RegularPages "Section" "blog")) 0 -}}
<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ $home }}" aria-label="Home">
      {{ with site.Home.Params.avatar }}<img class="brand-mark" src="{{ . | relURL }}" width="36" height="36" alt="">{{ end }}
      <span class="brand-name">{{ site.Title }}</span>
    </a>
    <nav class="nav" aria-label="Primary">
      <a href="{{ $home }}#work" data-section="work">Focus</a>
      <a href="{{ $home }}#experience" data-section="experience">Experience</a>
      <a href="{{ $home }}#open-source" data-section="open-source">Open source</a>
      {{- if $hasPosts }}
      <a href="{{ "blog/" | relURL }}" {{ if eq .Section "blog" }}class="active" aria-current="page"{{ end }}>Writing</a>
      {{- else }}
      <a href="{{ $home }}#skills" data-section="skills">Skills</a>
      {{- end }}
      <a href="{{ $home }}#contact" data-section="contact" class="nav-cta">Contact</a>
    </nav>
    <button class="theme-toggle" type="button" aria-label="Switch to dark theme">
      <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>
