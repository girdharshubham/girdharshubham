name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site   # the Hugo site lives in site/
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # full history so Hugo can read git dates

      - uses: jdx/mise-action@v5  # installs the Hugo version pinned in site/mise.toml
        with:
          working_directory: site

      - uses: actions/configure-pages@v6

      - name: Build                # URLs come from baseURL in site/hugo.toml (https://girdharshubham.com/)
        run: hugo --gc --minify

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./site/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
